name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci is intentionally not used here: Vite 8's Rolldown bundler ships
      # many platform-specific optional native-binding packages, and their
      # nested optional deps (e.g. @rolldown/binding-wasm32-wasi's own
      # @emnapi/runtime) don't always round-trip identically across a
      # lockfile generated on a different OS. npm install tolerates that;
      # npm ci's strict lockfile-match check does not.
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
